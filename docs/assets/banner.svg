<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="mcp-garmin-connect — LLM-agnostic Garmin Connect MCP server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#101d31"/>
      <stop offset="100%" stop-color="#122a42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#22c55e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1160" cy="40" r="220" fill="#38bdf8" opacity="0.06"/>
  <circle cx="80" cy="300" r="180" fill="#22c55e" opacity="0.05"/>
  <circle cx="1160" cy="40" r="120" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="1160" cy="40" r="160" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1.5"/>

  <text x="72" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700" fill="#f8fafc">GARMIN Connect MCP</text>
  <text x="72" y="168" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="26" fill="#94a3b8">LLM-agnostic MCP server for Garmin Connect</text>

  <rect x="72" y="205" rx="999" ry="999" width="150" height="40" fill="#0f2438" stroke="#38bdf8" stroke-opacity="0.35"/>
  <text x="147" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7dd3fc">26 tools</text>

  <rect x="238" y="205" rx="999" ry="999" width="170" height="40" fill="#0f2438" stroke="#22c55e" stroke-opacity="0.35"/>
  <text x="323" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#86efac">4 prompts</text>

  <rect x="424" y="205" rx="999" ry="999" width="168" height="40" fill="#0f2438" stroke="#94a3b8" stroke-opacity="0.35"/>
  <text x="508" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#cbd5e1">stdio + http</text>

  <rect x="608" y="205" rx="999" ry="999" width="120" height="40" fill="#0f2438" stroke="#94a3b8" stroke-opacity="0.35"/>
  <text x="668" y="231" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#cbd5e1">MIT</text>

  <path stroke="url(#pulse)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"
        d="M 72 288 H 220 L 252 258 L 284 288 H 420 L 452 240 L 484 288 H 660 L 692 268 L 724 288 H 980"/>
</svg>
